name: test

on:
  push:
    branches-ignore:
      - production
  pull_request:
    branches-ignore:
      - production
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: run
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"
          bun turbo typecheck
          bun turbo test
        env:
          CI: true

      - name: Audit npm dependencies
        run: bun audit --audit-level=moderate || true
        continue-on-error: true

      - name: Check for known vulnerabilities in Go dependencies
        working-directory: packages/sdk/go
        run: |
          if command -v go &> /dev/null; then
            go list -json -m all | go run golang.org/x/vuln/cmd/govulncheck@latest -mode=binary || true
          else
            echo "Go not installed, skipping Go vulnerability check"
          fi
        continue-on-error: true
